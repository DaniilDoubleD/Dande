function bubbleCaption(t){
 const L=LINES.find(l=>t>=l[0]&&t<l[1]+.25);if(!L)return;const a=eo((t-L[0])/.2);
 const words=L[2].split(' '),sp=(L[1]-L[0])/words.length,shown=Math.min(words.length,Math.floor((t-L[0])/sp)+1);
 g.font=`800 50px ${F}`;g.textAlign='center';const lines=[];let cur='';words.forEach((w,i)=>{const test=cur?cur+' '+w:w;if(g.measureText(test).width>900){lines.push(cur);cur=w}else cur=test});lines.push(cur);
 let wi=0;g.globalAlpha=a;lines.forEach((ln,li)=>{const y=1340+li*66;const tw=g.measureText(ln).width;let x=540-tw/2;ln.split(' ').forEach(w=>{const ww=g.measureText(w+' ').width;const on=wi<shown,act=wi==shown-1;g.textAlign='left';g.lineWidth=10;g.strokeStyle='#000';g.strokeText(w,x,y);g.fillStyle=act?'#ffd84a':on?'#fff':'rgba(255,255,255,.35)';g.fillText(w,x,y);x+=ww;wi++})});g.globalAlpha=1;
}
