<!doctype html><html><head><meta charset="utf-8"><title>Apple vs Microsoft</title>
<style>html,body{margin:0;background:#07080c}canvas{display:block;width:100vw;max-width:540px;margin:auto}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script>
const W=1080,H=1920,DUR=31,c=document.getElementById('c'),g=c.getContext('2d'),F='DejaVu Sans,sans-serif';
// approx market caps, $B  [year, month, value]
const AK=[[2000,1,112],[2000,12,4.8],[2001,12,7.7],[2002,12,5.2],[2003,12,8],[2004,12,26],[2005,12,61],[2006,12,73],[2007,12,174],[2008,12,76],[2009,12,190],[2010,5,222],[2010,12,296],[2011,12,377],[2012,9,656],[2012,12,500],[2013,12,500],[2014,12,647],[2015,12,584],[2016,12,609],[2017,12,868],[2018,10,1100],[2018,12,746],[2019,12,1300],[2020,12,2250],[2021,12,2910],[2022,12,2070],[2023,12,2990],[2024,1,2870],[2024,6,3200],[2024,12,3790],[2025,4,3000],[2025,12,4000]];
const MK=[[2000,1,600],[2000,12,231],[2001,12,358],[2002,12,277],[2003,12,297],[2004,12,290],[2005,12,272],[2006,12,293],[2007,12,333],[2008,12,172],[2009,12,268],[2010,5,220],[2010,12,234],[2011,12,218],[2012,12,224],[2013,12,311],[2014,12,382],[2015,12,439],[2016,12,483],[2017,12,660],[2018,10,820],[2018,12,780],[2019,12,1200],[2020,12,1680],[2021,12,2520],[2022,12,1790],[2023,12,2790],[2024,1,2900],[2024,6,3300],[2024,12,3130],[2025,4,2900],[2025,12,3600]];
const NK=[[2000,1,10],[2002,12,2],[2007,12,19],[2008,12,4.4],[2015,12,17],[2016,12,57],[2017,12,117],[2018,12,81],[2019,12,144],[2020,12,323],[2021,12,735],[2022,12,360],[2023,12,1220],[2024,6,3300],[2024,12,3290],[2025,4,2600],[2025,12,4500]];
const idx=([y,m])=>(y-2000)*12+m-1,N=idx([2025,12])+1;
function series(K){const o=[];for(let i=0;i<N;i++){const a=K.findLast(k=>idx(k)<=i),b=K.find(k=>idx(k)>=i);const ia=idx(a),ib=idx(b),t=ib==ia?0:(i-ia)/(ib-ia);const w=(i==ia||i==ib)?0:Math.sin(i*1.7+K.length)*.03;o.push(Math.exp(Math.log(a[2])*(1-t)+Math.log(b[2])*t)*(1+w))}return o}
const A=series(AK),M=series(MK),NV=series(NK);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},eo=t=>1-Math.pow(1-clamp(t),3),eb=t=>{t=clamp(t);const s=1.7;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const cap=v=>v>=1000?'$'+(v/1000).toFixed(2)+'T':'$'+Math.round(v)+'B';
const val=(a,f)=>{const i=Math.floor(f),j=Math.min(N-1,i+1);return a[i]+(a[j]-a[i])*(f-i)};
const T0=1.3,T1=21.3,TN=22.4;
const CA='#e8e8ee',CM='#27a0ff',CN='#76d63a';
// lead changes (AAPL vs MSFT)
const changes=[];for(let i=1;i<N;i++){const l=A[i]>M[i],p=A[i-1]>M[i-1];if(l!==p&&(!changes.length||i-changes[changes.length-1].i>4))changes.push({i,lead:l?'A':'M'})}
function rr(x,y,w,h,r,f,s,lw){g.beginPath();g.roundRect(x,y,w,h,r);if(f){g.fillStyle=f;g.fill()}if(s){g.strokeStyle=s;g.lineWidth=lw||3;g.stroke()}}
function txt(s,x,y,size,col,w=800,al='center'){g.font=`${w} ${size}px ${F}`;g.fillStyle=col;g.textAlign=al;g.fillText(s,x,y)}
function crown(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-26,12);g.lineTo(-30,-14);g.lineTo(-14,0);g.lineTo(0,-20);g.lineTo(14,0);g.lineTo(30,-14);g.lineTo(26,12);g.closePath();g.fill();g.restore()}
function renderAt(t){
 const gp=clamp((t-T0)/(T1-T0)),f=Math.pow(gp,1.05)*(N-1);
 const nvP=clamp((t-TN)/1.3),nvShow=t>TN-0.01;
 g.fillStyle='#07080c';g.fillRect(0,0,W,H);
 const bgG=g.createRadialGradient(W/2,1150,50,W/2,1150,1100);bgG.addColorStop(0,nvShow?'rgba(118,214,58,.10)':'rgba(39,160,255,.08)');bgG.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=bgG;g.fillRect(0,0,W,H);
 // title
 const ta=eo(t/.6);g.globalAlpha=ta;txt('APPLE',W/2-55,230,68,CA,900,'right');txt('vs',W/2,226,40,'#777',700);txt('MICROSOFT',W/2+55,230,68,CM,900,'left');
 txt('The fight to be the world’s #1 company',W/2,295,36,'#9aa0ab',600);g.globalAlpha=1;
 // counters
 const lead=val(A,f)>val(M,f)?'A':'M';const ca=eo((t-.6)/.6);g.globalAlpha=ca;
 const box=(x,label,v,col,isLead)=>{rr(x,350,440,140,24,'rgba(255,255,255,.05)',isLead?'#ffd23f':col+'66',isLead?5:3);txt(label,x+220,398,28,col,700);txt(cap(v),x+220,462,56,'#fff',900);if(isLead)crown(x+400,352,1.1)};
 box(80,'APPLE',val(A,f),CA,lead==='A'&&!nvShow);box(560,'MICROSOFT',val(M,f),CM,lead==='M'&&!nvShow);
 const yr=2000+Math.floor(f/12);rr(W/2-120,515,240,72,36,'#15171e','#333',2);txt(String(yr),W/2,565,44,'#fff',900);g.globalAlpha=1;
 // chart
 const X0=90,X1=W-90,Y0=640,Y1=1560,cw=X1-X0,ch=Y1-Y0;
 const fN=(TN<t)? (idx([2015,1])+( N-1-idx([2015,1]))*eo(nvP)) : -1;
 const hv=Math.max(val(A,f),val(M,f));let mx=1;for(let i=0;i<=Math.ceil(f)&&i<N;i++)mx=Math.max(mx,A[i],M[i]);
 let vw=Math.max(18,f*2.05),vx=f-vw/2,vh=Math.max(400,mx*2.1),vy=hv-vh/2;
 const fit=ease((t-TN)/1.6);const top=Math.max(A[N-1],NV[N-1],M[N-1])*1.12;const fw=(N-1)*1.06,fx=-(N-1)*.02,fh=top,fy=-top*.05;
 vw+=(fw-vw)*fit;vx+=(fx-vx)*fit;vh+=(fh-vh)*fit;vy+=(fy-vy)*fit;
 const sx=i=>X0+(i-vx)/vw*cw,sy=v=>Y1-(v-vy)/vh*ch;
 g.save();g.beginPath();g.rect(X0-40,Y0-40,cw+80,ch+130);g.clip();
 const gs=Math.pow(10,Math.floor(Math.log10(vh/4)));const st=gs*(vh/gs>20?5:vh/gs>8?2:1);
 g.font=`500 26px ${F}`;g.textAlign='left';for(let v=Math.ceil(vy/st)*st;v<vy+vh;v+=st){if(v<0)continue;const y=sy(v);g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=2;g.beginPath();g.moveTo(X0-40,y);g.lineTo(X1+40,y);g.stroke();g.fillStyle='rgba(255,255,255,.35)';g.fillText(cap(v),X0-30,y-8)}
 g.textAlign='center';for(let y=2000;y<=2025;y++){const x=sx((y-2000)*12);if(x<X0-60||x>X1+60)continue;g.fillStyle=(y-2000)*12<=f?'rgba(255,255,255,.45)':'rgba(255,255,255,.12)';if(vw<80||y%(vw>200?5:2)==0)g.fillText(y,x,Y1+45)}
 const line=(arr,to,from,col,wd,glow)=>{if(to<from)return;g.beginPath();for(let i=Math.floor(from);i<=Math.floor(to);i++){const x=sx(i),y=sy(arr[i]);i==Math.floor(from)?g.moveTo(x,y):g.lineTo(x,y)}g.lineTo(sx(to),sy(val(arr,to)));g.strokeStyle=col;g.lineWidth=wd;g.lineJoin='round';g.shadowColor=col;g.shadowBlur=glow;g.stroke();g.shadowBlur=0};
 const dot=(arr,ff,col)=>{const x=sx(ff),y=sy(val(arr,ff)),p=1+.25*Math.sin(t*8);g.fillStyle=col;g.shadowColor=col;g.shadowBlur=30;g.beginPath();g.arc(x,y,13*p,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#fff';g.beginPath();g.arc(x,y,6,0,7);g.fill()};
 if(gp>0){line(M,f,0,CM,7,22);line(A,f,0,CA,7,22);dot(M,f,CM);dot(A,f,CA);
  if(!nvShow){const lx=sx(f),ly=sy(hv);crown(lx,ly-40,1)}}
 if(fN>0){line(NV,fN,idx([2015,1]),CN,9,34);dot(NV,fN,CN);if(nvP>.6){crown(sx(fN),sy(val(NV,fN))-44,1.2)}}
 // crash markers
 [[2002,9,'Dot-com crash'],[2008,12,'2008 crisis'],[2022,10,'2022 sell-off']].forEach(([y,m,l])=>{const i=idx([y,m]);if(i>f||fit>.3||vw>170)return;const a=clamp((f-i)/5)*(1-clamp((f-i-30)/10));g.globalAlpha=a;g.fillStyle='#ff5a5a';g.font=`700 26px ${F}`;g.textAlign='center';g.fillText('▼ '+l,sx(i),sy(Math.min(A[i],M[i]))+55);g.globalAlpha=1});
 g.restore();
 // lead-change banner
 const ch2=changes.filter(c=>c.i<=f).pop();if(ch2&&!nvShow){const since=(f-ch2.i)/ (N/(T1-T0)) ;const a=clamp(1-(since-1.2)/0.4)*eb(since/0.3);if(a>0){g.save();g.translate(W/2,1690);g.scale(a,a);const L=ch2.lead==='A';rr(-400,-62,800,124,62,L?'#e8e8ee':'#27a0ff');crown(-365,-4,1.0);txt((L?'APPLE':'MICROSOFT')+' TAKES THE LEAD',0,18,46,L?'#07080c':'#fff',900);g.restore()}}
 // twist
 if(t>T1+0.2&&t<TN){const a=eo((t-T1-.2)/.4);g.globalAlpha=a;txt('But while they fought…',W/2,1700,52,'#fff',800);g.globalAlpha=1}
 if(nvShow){const fl=clamp(1-(t-TN)/.35);if(fl>0){g.fillStyle=`rgba(118,214,58,${.35*fl})`;g.fillRect(0,0,W,H)}
  const a=eb((t-TN-.3)/.5);if(a>0){g.save();g.translate(W/2,1700);g.scale(a,a);rr(-400,-70,800,140,30,CN);txt('NVIDIA',0,-8,56,'#07080c',900);txt(cap(val(NV,fN)),0,48,40,'#07080c',800);g.restore()}
  const e=eo((t-25.6)/.6);if(e>0){g.fillStyle=`rgba(7,8,12,${.82*e})`;g.fillRect(0,0,W,H);g.globalAlpha=e;
   txt('While Apple and Microsoft',W/2,760,52,'#fff',800);txt('fought for #1…',W/2,830,52,'#fff',800);
   txt('NVIDIA',W/2,1100,150,CN,900);txt('took the crown.',W/2,1190,56,'#fff',800);crown(W/2,925,2.0);
   txt(`${cap(NV[N-1])}  vs  ${cap(A[N-1])}  vs  ${cap(M[N-1])}`,W/2,1300,36,'#9aa0ab',700);g.globalAlpha=1}}
 g.textAlign='center';g.fillStyle='rgba(255,255,255,.28)';g.font=`400 20px ${F}`;g.fillText('Approx. market capitalization, 2000–2025. Not financial advice.',W/2,1895);
}
window.renderAt=renderAt;window.DATA={changes:changes.map(c=>[2000+Math.floor(c.i/12),c.i%12+1,c.lead])};
if(!location.search.includes('render')){const s=performance.now();(function L(n){renderAt(((n-s)/1000)%DUR);requestAnimationFrame(L)})(s)}
</script></body></html>
